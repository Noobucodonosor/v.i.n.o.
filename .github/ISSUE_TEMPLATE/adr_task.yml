name: "📋 Task Architetturale (ADR)"
description: "Crea un task operativo collegato a un Architecture Decision Record (docs/adr/)"
title: "[TASK-MODULO-XX] Titolo sintetico del task"
labels: ["adr"]
body:
  - type: input
    id: task_id
    attributes:
      label: "Task ID"
      description: "Codice univoco del task (es. TASK-SEC-01, TASK-TAB-02, TASK-CORE-01)"
      placeholder: "TASK-XXX-01"
    validations:
      required: true

  - type: input
    id: adr_ref
    attributes:
      label: "ADR di Riferimento"
      description: "Link o codice dell'ADR in docs/adr/ (es. ADR-0002)"
      placeholder: "docs/adr/0002-....md"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "Priorità"
      options:
        - "P0 — Critica (Sicurezza / Bloccante Produzione)"
        - "P1 — Alta (Feature Core / Modulo Prioritario)"
        - "P2 — Media (Evoluzione Pianificata / Ottimizzazione)"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "Contesto e Obiettivo Tecnico"
      description: "Perché serve questo task e cosa deve realizzare in base all'ADR?"
    validations:
      required: true

  - type: input
    id: files
    attributes:
      label: "File Coinvolti"
      description: "Elenco dei file da creare o modificare"
      placeholder: "main.py, index.html, tests/test_..."
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "Acceptance Criteria (Definition of Done)"
      description: "Elenco puntato di condizioni verificabili che devono essere soddisfatte"
      value: |
        - [ ] Criterio 1
        - [ ] Criterio 2
        - [ ] Nessuna regressione sui flussi esistenti
    validations:
      required: true

  - type: textarea
    id: verification_step
    attributes:
      label: "Verification Step (Comando di Test)"
      description: "Comando esatto o procedura automatica per verificare che il task funzioni"
      placeholder: "pytest tests/... oppure python3 e2e_test.py"
    validations:
      required: true
